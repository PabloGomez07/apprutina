<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- sin maximum-scale ni user-scalable: bloquear el zoom con pinza es una
     barrera de accesibilidad y ya no hace falta para evitar el zoom al
     enfocar un input (alcanza con font-size >= 16px en los campos) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AppRutina — Entrená a tu ritmo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">
  <!-- HOY (también aloja la vista "En sesión") -->
  <section id="screen-hoy" class="screen active"></section>

  <!-- ARMAR OTRA RUTINA (flujo manual, se conserva) -->
  <section id="screen-armar" class="screen">
    <div class="screen-pad">
      <button class="back-link" id="btnVolverHoy">‹ Volver</button>
      <div class="eyebrow">Armado manual</div>
      <h1 class="screen-title">Armá otra rutina</h1>

      <div class="section">
        <div class="eyebrow">1. ¿Qué día entrenás?</div>
        <div class="weekday-picker" id="weekdayPicker"></div>
      </div>

      <div class="section">
        <div class="eyebrow">2. Grupos musculares de hoy</div>
        <div class="priority-box">
          <label class="chip priority" id="chipRunning">
            <input type="checkbox" value="RUNNING" checked>
            <span>🦵 Articulaciones / Running <small>(prioridad)</small></span>
            <span class="chip-pct" id="chipRunningPct"></span>
            <div class="chip-bar"><div id="chipRunningBar"></div></div>
          </label>
        </div>
        <div class="group-grid" id="groupGrid"></div>
      </div>

      <div class="cta-block">
        <button id="btnGenerar" class="btn btn-primary">Generar rutina de hoy</button>
      </div>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="screen-historial" class="screen"></section>

  <!-- PROGRESO -->
  <section id="screen-progreso" class="screen"></section>

  <!-- AJUSTES -->
  <section id="screen-ajustes" class="screen"></section>
</main>

<!-- BARRA DE TABS INFERIOR -->
<nav class="bottom-tabs" id="bottomTabs" aria-label="Secciones">
  <button class="tab-item active" data-tab="hoy" aria-current="page"><span class="tab-ico" aria-hidden="true">🏋️</span><span class="tab-label">Hoy</span></button>
  <button class="tab-item" data-tab="historial"><span class="tab-ico" aria-hidden="true">🗓</span><span class="tab-label">Historial</span></button>
  <button class="tab-item" data-tab="progreso"><span class="tab-ico" aria-hidden="true">📈</span><span class="tab-label">Progreso</span></button>
  <button class="tab-item" data-tab="ajustes"><span class="tab-ico" aria-hidden="true">⚙️</span><span class="tab-label">Ajustes</span></button>
</nav>

<!-- FICHA DE EJERCICIO (hoja a pantalla completa) -->
<div id="sheetFicha" class="sheet sheet-full" role="dialog" aria-modal="true" aria-label="Ficha del ejercicio" hidden></div>

<!-- CAMBIAR EJERCICIO (hoja parcial 66%) -->
<div id="sheetSwap" class="sheet sheet-partial" role="dialog" aria-modal="true" aria-label="Cambiar ejercicio" hidden></div>

<!-- VELO -->
<div id="scrim" class="scrim" aria-hidden="true" hidden></div>

<script src="data.js"></script>
<script src="anims.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
